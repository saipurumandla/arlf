[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alrf"
version = "0.1.0"
description = "Adaptive LLM Routing Framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.34",
    "tiktoken",
    "structlog>=24.0",
    "httpx>=0.27",
    "python-dotenv",
    "google-generativeai>=0.8",
    "aiosqlite>=0.20",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
alrf = "alrf.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning:google"]

[tool.mypy]
strict = true
